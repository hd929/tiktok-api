services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-api-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-api-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: tiktok-api-nginx
    restart: unless-stopped
    ports:
      # 8000 trên host đang bị uvicorn (novel-scraper) chiếm IPv4 → dùng 8001
      - "8001:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: tiktok-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tiktok_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  vendor:
